<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market JSF-Hasiera</title>
    <h:outputStylesheet library="css" name="style.css" />  
</h:head>
<h:body>
    <h:form>
        <h:messages style="color:red" />
        <p>
		    Email:
		    <h:inputText id="email" value="#{eskaintzaSortu.sellerEmail}"
		                 required="true" requiredMessage="Emaila derrigorrezkoa da."
		                 validatorMessage="Email formatua ez da zuzena.">
		        <f:validateRegex pattern="^[\w\.-]+@[\w\.-]+\.\w{2,4}$" />
		        <f:ajax event="blur" render="msgEmail" />
		    </h:inputText>
		    <h:message id="msgEmail" for="email" style="color:red" />
		</p>	
        <p>
            <h:commandButton value="Eskaintza Sortu" action="sortu" />
        </p>
        <p>
            <h:commandButton value="Eskaintzak Kontsultatu" action="eskaintzakKontsultatu" />
        </p>
    </h:form>
</h:body>
</html>
